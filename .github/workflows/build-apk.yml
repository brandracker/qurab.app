name: Build Android APK (Qurb)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Qurb Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: serene-union-app
        run: npm install

      - name: Build Web Production Assets
        working-directory: serene-union-app
        run: npm run build

      - name: Set Executable Permissions on Gradlew
        run: chmod +x serene-union-app/android/gradlew

      - name: Sync Capacitor Android
        working-directory: serene-union-app
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: serene-union-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qurb-Android-Debug-APK
          path: serene-union-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
