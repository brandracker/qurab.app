name: Build Android Release AAB & APK (Qurb)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Qurb Android Release Bundle & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Frontend Dependencies
        working-directory: serene-union-app
        run: npm install

      - name: Verify Frontend Test Suite (201 Tests)
        working-directory: serene-union-app
        run: npm test

      - name: Build Web Production Assets
        working-directory: serene-union-app
        run: npm run build

      - name: Set Executable Permissions on Gradlew
        run: chmod +x serene-union-app/android/gradlew

      - name: Sync Capacitor Android
        working-directory: serene-union-app
        run: npx cap sync android

      - name: Generate Release Signing Keystore
        working-directory: serene-union-app/android/app
        run: |
          if [ ! -f "qurb-release-key.jks" ]; then
            echo "Generating production release keystore..."
            keytool -genkeypair -v \
              -keystore qurb-release-key.jks \
              -alias qurb-release-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "QurbReleasePassword2026!" \
              -keypass "QurbReleasePassword2026!" \
              -dname "CN=Qurb Matrimony, OU=Engineering, O=Brandracker, L=London, ST=London, C=GB"
          else
            echo "Release keystore already exists."
          fi

      - name: Build Signed Release AAB & APK with Gradle
        working-directory: serene-union-app/android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Qurb Admin Standalone APK
        working-directory: admin-android
        continue-on-error: true
        run: |
          chmod +x gradlew
          if [ -f "../serene-union-app/android/app/qurb-release-key.jks" ]; then
            cp -f ../serene-union-app/android/app/qurb-release-key.jks app/qurb-release-key.jks
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace || true
          ls -la app/build/outputs/apk/release/ || true
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp -f app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Qurb-Admin.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp -f app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Qurb-Admin.apk
          fi

      - name: Upload Play Store Signed Release AAB (Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: Qurb-Android-Release-AAB
          path: serene-union-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Qurb-Android-Release-APK
          path: serene-union-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Qurb Admin Standalone APK (Executive Portal)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Qurb-Admin-Portal-APK
          path: admin-android/app/build/outputs/apk/release/Qurb-Admin.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Backup Release Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Qurb-Signing-Keystore
          path: serene-union-app/android/app/qurb-release-key.jks
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          fail_on_unmatched_files: false
          tag_name: v1.0.32
          name: "Qurb v1.0.32 (Build 33 - Profile Quality Meter, WebP Thumbnails & Travel Engine)"
          body: |
            ### Qurb Matrimony v1.0.32 (Build 33 - Profile Quality Meter, WebP Thumbnails & Travel Engine)
            - **WebP Seed Avatar Thumbnails**: 99% bandwidth reduction on avatar loading using 140x140 WebP thumbnails.
            - **Profile Completeness & Quality Score**: Gamified strength meter on MyProfile, discover visibility gating (<50% filtered out), and action gating (<60% requires profile completion before sending likes/salams).
            - **Auto-Location & Travel Engine**: Haversine distance calculation, Pakistani city centroid matching, Edge IP fallback, and 1-tap travel update banner.
            - **Chat Screen Rebrand & 3-Dots Management**: Luxury Qurb branding, conversation search bar, bulk delete, mark all as read, and clear inactive chats.
            - **Bleed-Through Isolation & Zero-Polling**: Dynamic React room keys prevent message bleeding across chats; HTTP polling turns off when WebSocket is active.
            - **"You Liked" Pipeline**: Cleaned up seed auto-mutual behavior so sent likes populate the "You Liked" tab properly.
            - **app-release.apk**: Production Signed APK for direct device installation & testing.
            - **app-release.aab**: Production Signed Android App Bundle (.aab) ready for Google Play Console.
          files: |
            serene-union-app/android/app/build/outputs/apk/release/app-release.apk
            serene-union-app/android/app/build/outputs/bundle/release/app-release.aab
            admin-android/app/build/outputs/apk/release/Qurb-Admin.apk
