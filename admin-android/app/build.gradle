apply plugin: 'com.android.application'

android {
    namespace = "app.qurb.admin"
    compileSdk = rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : 35

    defaultConfig {
        applicationId = "app.qurb.admin"
        minSdk = rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : 24
        targetSdk = rootProject.hasProperty('targetSdkVersion') ? rootProject.targetSdkVersion : 35
        versionCode = 1
        versionName = "1.0.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFile = file('qurb-release-key.jks')
            if (!keystoreFile.exists()) {
                keystoreFile = file('../../serene-union-app/android/app/qurb-release-key.jks')
            }
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = 'QurbReleasePassword2026!'
                keyAlias = 'qurb-release-key'
                keyPassword = 'QurbReleasePassword2026!'
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
        }
        debug {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.annotation:annotation:1.9.1'
}

