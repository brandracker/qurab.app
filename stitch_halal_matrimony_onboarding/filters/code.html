<style>
        .custom-range-slider {
            -webkit-appearance: none;

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col justify-center items-center">
<div class="w-full max-w-max-width bg-surface min-h-screen flex flex-col relative overflow-hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 flex items-center justify-between px-container-padding h-16 w-full max-w-[480px] mx-auto bg-surface dark:bg-surface-dim z-10">
<button class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary dark:text-primary-fixed-dim">Filters</h1>
<div class="w-10 h-10"></div> <!-- Spacer -->
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-container-padding py-stack-gap pb-32">
<div class="flex flex-col gap-section-gap">
<!-- Age Range -->
<section class="border-b border-surface-variant pb-stack-gap">
<div class="flex justify-between items-center mb-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Age Range</h2>
<span class="font-body-sm text-body-sm text-secondary">18 - 40+</span>
</div>
<div class="px-2">
<input class="custom-range-slider" max="60" min="18" type="range" value="30"/>
</div>
</section>
<!-- Distance -->
<section class="border-b border-surface-variant pb-stack-gap">
<div class="flex justify-between items-center mb-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Distance</h2>
<span class="font-body-sm text-body-sm text-secondary">50 miles</span>
</div>
<div class="px-2 mb-6">
<input class="custom-range-slider" max="100" min="1" type="range" value="50"/>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" placeholder="Search city" type="text"/>
</div>
</section>
<!-- Sect -->
<section class="border-b border-surface-variant pb-stack-gap">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-4">Sect</h2>
<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Sunni</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Shia</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Other</span>
</label>
</div>
</section>
<!-- Practice Level -->
<section class="border-b border-surface-variant pb-stack-gap">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-4">Practice Level</h2>

<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Practicing</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Moderately practicing</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Cultural Muslim</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Revert</span>
</label>
</div>
</section>

</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Marriage when I find the right person</span>

<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary-container focus:ring-primary-container checked:bg-primary-container checked:border-primary-container bg-surface-container-low" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Just exploring</span>
</label>
</div>
</section>
